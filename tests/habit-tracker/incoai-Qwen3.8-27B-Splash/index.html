<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rhythm – Habit- &amp; Stimmungs-Tracker</title>
    <meta
      name="description"
      content="Ruhiger, offlinefähiger Tracker für tägliche Gewohnheiten und Stimmung. Alle Daten bleiben auf deinem Gerät."
    />
    <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script>
      // Theme wird vor dem ersten Paint gesetzt, um Farbsprünge zu vermeiden.
      ;(function () {
        try {
          var stored = localStorage.getItem('rhythm-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* localStorage nicht verfügbar */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
