<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F1" />
    <meta
      name="description"
      content="Rhythm – dein lokaler Habit- und Stimmungs-Tracker. Offline-fähig, ohne Cloud, ohne Account."
    />
    <title>Rhythm</title>
    <script>
      // Setzt das Dark-Mode-Flag, bevor React lädt (verhindert Farbsprünge).
      ;(function () {
        try {
          var stored = localStorage.getItem('rhythm.theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          /* z. B. Privatmodus: Standard bleibt Hell */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
