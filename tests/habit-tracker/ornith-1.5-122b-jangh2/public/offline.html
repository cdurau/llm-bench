<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBFA" />
    <title>Rhythm — offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fbfbfa;
        color: #2b2b29;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #161615; color: #eceae4; }
        .card { background: #21211f; border-color: #33332f; }
        .btn { background: #2b2b29; color: #eceae4; border-color: #33332f; }
      }
      .wrap { max-width: 340px; }
      .card {
        border: 1px solid #e4e4e1;
        border-radius: 16px;
        padding: 28px 24px;
        background: #ffffff;
      }
      .mark { font-size: 40px; line-height: 1; }
      h1 { font-size: 20px; margin: 14px 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #6b6b66; margin: 0 0 18px; }
      .btn {
        display: inline-block;
        border: 1px solid #d4d4d0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        color: #2b2b29;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="mark" aria-hidden="true">🌱</div>
        <h1>Offline</h1>
        <p>
          Du bist gerade nicht verbunden. Rhythm funktioniert trotzdem weiter – deine Habits,
          Erledigungen und Stimmungen sind lokal gespeichert.
        </p>
        <a class="btn" href="/">Zur App</a>
      </div>
    </div>
  </body>
</html>
