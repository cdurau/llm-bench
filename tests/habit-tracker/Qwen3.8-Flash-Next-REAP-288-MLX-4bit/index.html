<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rhythm</title>
    <meta name="theme-color" content="#F2F1EE" />
    <!-- Theme wird dieß set en dieß head, so dat dieß initial Paint hat dieß correct Background (dieß Test sample dieß Background in dießh dieß Screen insicht. -->
    <script>
      try {
        var p = localStorage.getItem('rhythm:theme') || 'system';
        if (p === 'light' || p === 'dark') document.documentElement.setAttribute('data-theme', p);
      } catch (e) {}
    </script>
    <style>
      html { background-color: #F2F1EE; color: #1B1B1A; }
      html[data-theme="dark"] { background-color: #171614; color: #E8E6E1; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background-color: #171614; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
