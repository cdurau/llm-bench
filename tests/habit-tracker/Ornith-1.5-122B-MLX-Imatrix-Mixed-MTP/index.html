<!doctype html>
<html lang="de" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F3" />
    <meta name="description" content="Rhythm — Gewohnheiten und Stimmung, ganz einfach." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Rhythm</title>
    <script>
      // Vermeidet einen Theme-Sprung vor dem ersten Render.
      (function () {
        var t = localStorage.getItem('rhythm.theme');
        document.documentElement.setAttribute('data-theme', t || 'system');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
